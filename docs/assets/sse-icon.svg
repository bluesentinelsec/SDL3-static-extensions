<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SDL3 Static Extensions logo">
  <!-- A solid block assembled from smaller blocks: everything statically linked into one artifact. -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#1b2430"/>
  <g fill="#4fc3f7">
    <rect x="12" y="12" width="18" height="18" rx="3"/>
    <rect x="34" y="12" width="18" height="18" rx="3" fill="#81d4fa"/>
    <rect x="12" y="34" width="18" height="18" rx="3" fill="#29b6f6"/>
  </g>
  <g fill="#ffb74d">
    <rect x="34" y="34" width="8" height="8" rx="2"/>
    <rect x="44" y="34" width="8" height="8" rx="2"/>
    <rect x="34" y="44" width="8" height="8" rx="2"/>
    <rect x="44" y="44" width="8" height="8" rx="2"/>
  </g>
</svg>
