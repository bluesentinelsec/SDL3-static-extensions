# Generated by cppboot (--with-ios-ci)
# iOS XCFramework: build static device (arm64) and simulator (arm64/x86_64)
# libraries, package and verify the XCFramework, and run the consumer package
# tests in an iOS Simulator.
name: iOS

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (XCFramework / simulator)
    runs-on: macos-latest
    timeout-minutes: 35

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Build Debug XCFramework and consumer apps
        run: |
          bash scripts/build_ios_xcframework.sh Debug build/ios/debug
          bash scripts/build_ios_test_apps.sh \
            build/ios/debug/SDL3-static-extensions.xcframework Debug build/ios/consumer-debug

      - name: Build Release XCFramework and consumer apps
        run: |
          bash scripts/build_ios_xcframework.sh Release build/ios/release
          bash scripts/build_ios_test_apps.sh \
            build/ios/release/SDL3-static-extensions.xcframework Release build/ios/consumer-release

      - name: Run Release package tests in iOS Simulator
        env:
          BUILD_DIR: build/ios/consumer-release/iphonesimulator
        run: bash scripts/run_ios_tests.sh

      - name: Stage iOS package metadata
        id: ios_package
        run: |
          version="$(tr -d '[:space:]' < VERSION | sed 's/^v//;s/^V//;s/#.*//')"
          echo "artifact_name=SDL3-static-extensions-ios-xcframework-release-${version}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=build/ios/release/SDL3-static-extensions-ios-xcframework-release-${version}.zip" >> "${GITHUB_OUTPUT}"

      - name: Upload iOS package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ios_package.outputs.artifact_name }}
          path: ${{ steps.ios_package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
