# Generated by cppboot (--with-android-ci)
# Android Prefab AAR: Gradle/AGP drives the CMake build (NDK auto-installed),
# the release AAR contents are verified, and the consumer test app runs the
# native test suite on an Android emulator.
name: Android

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (Prefab AAR / emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Debug AAR and consumer APK
        run: |
          bash android/gradlew -p android --no-daemon :SDL3_static_extensions:assembleDebug
          bash android/gradlew -p android --no-daemon :test-app:assembleDebug

      - name: Build Release AAR and consumer APK
        run: |
          bash android/gradlew -p android --no-daemon :SDL3_static_extensions:assembleRelease
          bash android/gradlew -p android --no-daemon :test-app:assembleRelease

      - name: Verify Release AAR
        run: |
          set -euo pipefail
          aar=android/SDL3_static_extensions/build/outputs/aar/SDL3_static_extensions-release.aar
          test -f "${aar}"
          unzip -Z1 "${aar}" > aar-entries.txt
          for abi in armeabi-v7a arm64-v8a x86_64; do
            grep -qx "prefab/modules/SDL3_static_extensions/libs/android.${abi}/libSDL3_static_extensions.so" aar-entries.txt
            grep -qx "jni/${abi}/libSDL3_static_extensions.so" aar-entries.txt
          done
          grep -qx "prefab/modules/SDL3_static_extensions/include/SDL3_static_extensions/version.hpp" aar-entries.txt
          version="$(tr -d '[:space:]' < VERSION | sed 's/^v//;s/^V//;s/#.*//')"
          unzip -p "${aar}" prefab/prefab.json | grep -q "\"version\"[[:space:]]*:[[:space:]]*\"${version}\""

          # The headers a consumer actually includes. Shipping only
          # version.hpp is why nobody noticed the library was empty.
          for header in SDLStatic/engine.h SDLStatic/bindings.h SDL3/SDL.h; do
            grep -qx "prefab/modules/SDL3_static_extensions/include/${header}" aar-entries.txt
          done

          # And the engine itself. ABIs, paths and version were all true of a
          # library containing one object file, so check for the code.
          mkdir -p aar-check && unzip -o -q "${aar}" -d aar-check
          so="aar-check/jni/arm64-v8a/libSDL3_static_extensions.so"
          size="$(stat -c%s "${so}")"
          if [ "${size}" -lt 5000000 ]; then
            echo "${so} is ${size} bytes — that is a placeholder, not the SDK" >&2
            exit 1
          fi
          nm -D --defined-only "${so}" > aar-symbols.txt
          for symbol in SDLStatic_CreateEngine SDLStatic_ActorSpawn \
                        SDLStatic_OpenLuaBindings SDLStatic_CreateGui SDL_CreateWindow; do
            if ! grep -qw "${symbol}" aar-symbols.txt; then
              echo "Missing ${symbol} — the AAR is not carrying the engine" >&2
              exit 1
            fi
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Release package tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/run_android_tests.sh

      - name: Package Android Release AAR
        id: package
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION | sed 's/^v//;s/^V//;s/#.*//')"
          stem="SDL3-static-extensions-android-release-${version}"
          mkdir -p dist
          cp android/SDL3_static_extensions/build/outputs/aar/SDL3_static_extensions-release.aar "dist/${stem}.aar"
          echo "artifact_name=${stem}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=dist/${stem}.aar" >> "${GITHUB_OUTPUT}"

      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
